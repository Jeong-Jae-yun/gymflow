services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - gymflow-prod-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required (e.g. ghcr.io/owner/gymflow-backend:<sha>)}
    env_file:
      - ./.env.prod
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gymflow-prod-network
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gymflow-prod-network
    restart: unless-stopped

networks:
  gymflow-prod-network:
    driver: bridge
