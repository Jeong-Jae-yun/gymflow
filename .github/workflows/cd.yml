name: GymFlow Backend CD

on:
  workflow_run:
    workflows:
      - "GymFlow Backend CI"
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: gymflow-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-02a4b8bc88ff676c3
  EC2_PROJECT_DIR: /home/ec2-user/gymflow
  IMAGE_NAME: gymflow-backend

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute lowercase image repository
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repository=ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710165591909:role/GymFlowGitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        id: deploy
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha }}
          DEPLOY_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail

          echo "Deployment target SHA: ${DEPLOY_SHA}"
          echo "Deployment image tag: ${DEPLOY_IMAGE}"

          REMOTE_SCRIPT=$(cat <<EOS
          set -euo pipefail

          PROJECT_DIR="${EC2_PROJECT_DIR}"
          IMAGE="${DEPLOY_IMAGE}"
          TARGET_SHA="${DEPLOY_SHA}"

          cd "\${PROJECT_DIR}"

          echo "== git sync to \${TARGET_SHA} =="
          git fetch origin main
          git checkout --detach "\${TARGET_SHA}"

          docker compose version

          echo "== pull backend image \${IMAGE} =="
          BACKEND_IMAGE="\${IMAGE}" docker compose --env-file .env.prod -f compose.prod.yaml pull backend

          echo "== recreate backend container =="
          BACKEND_IMAGE="\${IMAGE}" docker compose --env-file .env.prod -f compose.prod.yaml up -d --no-deps backend

          echo "== docker compose ps =="
          BACKEND_IMAGE="\${IMAGE}" docker compose --env-file .env.prod -f compose.prod.yaml ps

          echo "== backend recent logs =="
          BACKEND_IMAGE="\${IMAGE}" docker compose --env-file .env.prod -f compose.prod.yaml logs --tail=80 backend

          echo "== smoke test: GET /actuator/health via nginx (expect HTTP 200) =="
          SMOKE_OK=0
          for i in \$(seq 1 10); do
            STATUS=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/actuator/health || echo "000")
            echo "attempt \${i}: HTTP \${STATUS}"
            if [ "\${STATUS}" = "200" ]; then
              SMOKE_OK=1
              break
            fi
            sleep 5
          done

          if [ "\${SMOKE_OK}" -ne 1 ]; then
            echo "SMOKE TEST FAILED: /actuator/health did not return expected HTTP 200 after 10 attempts"
            exit 1
          fi

          echo "SMOKE TEST PASSED"
          echo "Deployed image: \${IMAGE}"
          EOS
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GymFlow backend deploy ${DEPLOY_SHA}" \
            --parameters "{\"commands\":[$(printf '%s' "$REMOTE_SCRIPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')]}" \
            --query "Command.CommandId" \
            --output text \
            --region "${AWS_REGION}")

          echo "SSM command ID: ${COMMAND_ID}"

          STATUS="InProgress"
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "poll ${i}: SSM status = ${STATUS}"

            if [ "${STATUS}" != "Pending" ] && [ "${STATUS}" != "InProgress" ] && [ "${STATUS}" != "Delayed" ]; then
              break
            fi
          done

          echo "== SSM command output =="
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query "StandardOutputContent" \
            --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "== SSM command error output =="
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "StandardErrorContent" \
              --output text || true
            echo "SSM command final status: ${STATUS}"
            exit 1
          fi

          echo "SSM command final status: ${STATUS}"
