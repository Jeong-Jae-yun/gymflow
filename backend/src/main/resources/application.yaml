spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

websocket:
  allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    resource-image-bucket: ${S3_RESOURCE_IMAGE_BUCKET:gymflow-resource-images}